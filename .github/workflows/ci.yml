name: CI
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      - name: pre-commit
        run: pixi run pre-commit-run --color=always --show-diff-on-failure

  check-typst-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      - name: Check typst version matches typst.toml
        run: |
          pixi_version="$(pixi list --json | grep -A1 '"name": "typst"' | grep '"version"' | sed -E 's/.*"version": "(.*)".*/\1/')"
          toml_version="$(grep -E '^compiler\s*=' typst.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "pixi: $pixi_version, typst.toml: $toml_version"
          if [[ "$pixi_version" != "$toml_version" ]]; then
            echo "error: typst version mismatch" >&2
            exit 1
          fi

  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      - name: Use local package
        run: |
          sed -i 's/#import .*/#import "..\/lib.typ": */' template/cv.typ
      - name: Compile
        run: pixi run compile
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: template/cv.pdf
          if-no-files-found: error
      - name: Compile thumbnail
        run: pixi run compile-thumbnail
      - name: Verify git status is clean
        run: |
          git checkout -- template/cv.typ
          git status --porcelain
          git diff --quiet
