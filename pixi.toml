[workspace]
name = "moderner-cv"
channels = ["conda-forge"]
exclude-newer = "7d"
platforms = ["osx-arm64", "linux-64", "win-64"]

[tasks]
pre-commit-run = "pre-commit run -a"

[dependencies]
typstyle = ">=0.14"
typos = "*"
pre-commit = "*"
pre-commit-hooks = "*"

[feature.typst.tasks]
watch = "typst watch template/cv.typ --root ."
# TODO: treat warnings as errors https://github.com/typst/typst/issues/6787
compile = "typst compile template/cv.typ --root ."
compile-thumbnail = { cmd = "typst compile template/cv.typ assets/thumbnail.png --root .", env = { SOURCE_DATE_EPOCH = "1767225600" } }

[feature.typst.dependencies]
# The lower bound is the oldest supported Typst version.
# CI checks that it matches `compiler` in typst.toml.
typst = ">=0.14"
font-otf-fontawesome = ">=7"

[environments]
default = ["typst"]
# Solves `typst` feature dependencies to their lowest allowed versions.
typst-old = { features = ["typst"], no-default-feature = true, solve-strategy = "lowest-direct" }
